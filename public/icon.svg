<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0051ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#00f0ff" stroke-width="8" stroke-opacity="0.4"/>
  
  <!-- Outer Tech Hexagon / Circuit Frame -->
  <polygon points="256,64 432,160 432,352 256,448 80,352 80,160" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing Stylized 'W' -->
  <path d="M140 160 L195 360 L256 240 L317 360 L372 160 L325 160 L285 305 L256 220 L227 305 L187 160 Z" 
        fill="url(#neon)" 
        filter="url(#glow)"/>
        
  <!-- Core Accent Points -->
  <circle cx="256" cy="220" r="8" fill="#ffffff" />
  <circle cx="195" cy="360" r="6" fill="#00f0ff" />
  <circle cx="317" cy="360" r="6" fill="#00f0ff" />
</svg>
